name: _docker-build

# Reusable docker build: pushes amd64 + arm64, then a multi-arch manifest.
# Callers pass the tag base (e.g. `v0.4.0` or `sha-abc123`) and decide
# whether to also publish a `:latest` manifest.
on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to check out"
        required: false
        type: string
        default: ""
      tag_base:
        description: "Base tag for the image (e.g. v0.4.0 or sha-XXX)"
        required: true
        type: string
      push_latest:
        description: "Also tag and push :latest"
        required: false
        type: boolean
        default: false
    secrets:
      wiz-client-secret:
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/huggingface/hf-mount-fuse

permissions: {}

jobs:
  amd64:
    permissions:
      contents: read
      packages: write
    name: Build & Push Docker (amd64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      # The runner is native amd64, so the build loads into the local image store, which
      # is the only place the Wiz CLI reads. The push is therefore gated on the scan, and
      # the pushed digest is registered so cluster admission recognises the image.
      - uses: huggingface/wiz-image-action/build-push@53a5b4af184193adf1773753f29b3f903445e31b # v1.3.0
        with:
          image: ${{ env.IMAGE }}:${{ inputs.tag_base }}-amd64
          context: .
          cache-to: type=registry,ref=${{ env.IMAGE }}-cache:amd64,mode=max
          cache-from: type=registry,ref=${{ env.IMAGE }}-cache:amd64
          clientId: ${{ vars.WIZ_CLI_CLIENT_ID }}
          clientSecret: ${{ secrets.wiz-client-secret }}

  arm64:
    permissions:
      contents: read
      packages: write
    name: Build & Push Docker (arm64)
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      # The runner is native arm64, so the build loads into the local image store, which
      # is the only place the Wiz CLI reads. The push is therefore gated on the scan, and
      # the pushed digest is registered so cluster admission recognises the image.
      - uses: huggingface/wiz-image-action/build-push@53a5b4af184193adf1773753f29b3f903445e31b # v1.3.0
        with:
          image: ${{ env.IMAGE }}:${{ inputs.tag_base }}-arm64
          context: .
          cache-to: type=registry,ref=${{ env.IMAGE }}-cache:arm64,mode=max
          cache-from: type=registry,ref=${{ env.IMAGE }}-cache:arm64
          clientId: ${{ vars.WIZ_CLI_CLIENT_ID }}
          clientSecret: ${{ secrets.wiz-client-secret }}

  manifest:
    permissions:
      packages: write
    name: Publish Docker manifest
    needs: [amd64, arm64]
    runs-on: ubuntu-22.04
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Create and push manifest
        env:
          TAG_BASE: ${{ inputs.tag_base }}
          PUSH_LATEST: ${{ inputs.push_latest }}
        run: |
          BASE="${TAG_BASE}"
          TAGS="-t ${IMAGE}:${BASE}"
          if [[ "${PUSH_LATEST}" == "true" ]]; then
            TAGS="${TAGS} -t ${IMAGE}:latest"
          fi
          docker buildx imagetools create $TAGS \
            "${IMAGE}:${BASE}-amd64" \
            "${IMAGE}:${BASE}-arm64"

      - name: Summary
        env:
          TAG_BASE: ${{ inputs.tag_base }}
          PUSH_LATEST: ${{ inputs.push_latest }}
        run: |
          echo "### Docker image pushed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${IMAGE}:${TAG_BASE}\`" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${PUSH_LATEST}" == "true" ]]; then
            echo "\`${IMAGE}:latest\`" >> "$GITHUB_STEP_SUMMARY"
          fi
